<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="BAJRANG AI — your free personal AI assistant.">
  <title>BAJRANG AI</title>
  <style>
    :root { color-scheme: dark; --bg:#101827; --panel:#19263a; --accent:#63d6b3; --muted:#aab8ca; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at top,#243b55,var(--bg) 60%); color:#f7fafc; font:16px system-ui,-apple-system,Segoe UI,sans-serif; }
    main { width:min(100%,560px); padding:32px 24px; text-align:center; background:rgba(25,38,58,.92); border:1px solid #33465f; border-radius:24px; box-shadow:0 18px 55px #0006; }
    .mark { width:72px; height:72px; margin:0 auto 18px; display:grid; place-items:center; border-radius:22px; background:var(--accent); color:#102033; font-size:30px; font-weight:800; }
    h1 { margin:0; letter-spacing:.08em; font-size:clamp(28px,8vw,42px); }
    .tag { margin:10px 0 24px; color:var(--accent); font-weight:600; }
    p { color:var(--muted); line-height:1.65; }
    a { display:inline-block; margin-top:18px; padding:13px 22px; border-radius:12px; background:var(--accent); color:#102033; text-decoration:none; font-weight:700; }
    footer { margin-top:26px; color:#8192a9; font-size:12px; }
  </style>
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bajrang AI">
  <meta name="application-name" content="Bajrang AI">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">B</div>
    <h1>BAJRANG AI</h1>
    <div class="tag">Your Free Personal AI Assistant</div>
    <p>One place for learning, planning, ideas, and keeping track of your projects.</p>
    <p lang="hi">नमस्ते! बजरंग AI में आपका स्वागत है।</p>
    <a href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">Open ChatGPT</a>
    <footer>Made with AI · Personal project</footer>
  </main>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
